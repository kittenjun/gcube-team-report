<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GCUBE · 업무 차트</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{margin:0;background:#f3f6fa;color:#20324a;font:14px/1.6 system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 24px}header{border-bottom:1px solid #dce4ee;padding-bottom:18px}h1{margin:4px 0;font-size:27px}.muted{color:#596b80}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.card{background:#fff;border:1px solid #dce4ee;border-radius:10px;padding:16px}.card h2{font-size:16px;margin:0 0 10px}.chart{height:280px}a{color:#225bc2;text-decoration:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:18px 14px}}</style></head><body><div class="wrap"><header><p><a href="index.html">← 업무 상세로 이동</a></p><h1>GCUBE 업무 차트</h1><p id="period" class="muted"></p></header><main class="grid"><section class="card"><h2>업무 주제별 티켓</h2><div class="chart"><canvas id="topics"></canvas></div></section><section class="card"><h2>상태별 티켓</h2><div class="chart"><canvas id="status"></canvas></div></section><section class="card"><h2>팀원별 티켓</h2><div class="chart"><canvas id="people"></canvas></div></section><section class="card"><h2>업무 주제별 상태 분포</h2><div class="chart"><canvas id="mix"></canvas></div></section></main></div><script>const D=__REPORT_DATA__;const topics=['GCUBE 플랫폼','PC방 솔루션','강의 솔루션','테스트 TOOLS','기타'],statuses=['새로열림','진행','리뷰','완료'];document.getElementById('period').textContent=`대상 기간: ${D.start} ~ ${D.end} · 생성: ${D.generated}`;const counts=(arr,key)=>arr.map(x=>D.entries.filter(e=>key(e)===x).length);const people=[...new Set(D.entries.map(e=>e.who))];const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}};new Chart(document.getElementById('topics'),{type:'bar',data:{labels:topics,datasets:[{label:'티켓 수',data:counts(topics,e=>e.topics[0]),backgroundColor:'#225bc2'}]},options:{...base,scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});new Chart(document.getElementById('status'),{type:'doughnut',data:{labels:statuses,datasets:[{data:counts(statuses,e=>e.group),backgroundColor:['#6b8afd','#f59e0b','#8b5cf6','#16a34a']}]},options:base});new Chart(document.getElementById('people'),{type:'bar',data:{labels:people,datasets:statuses.map((s,i)=>({label:s,data:people.map(p=>D.entries.filter(e=>e.who===p&&e.group===s).length),backgroundColor:['#6b8afd','#f59e0b','#8b5cf6','#16a34a'][i]}))},options:{...base,indexAxis:'y',scales:{x:{stacked:true,beginAtZero:true,ticks:{precision:0}},y:{stacked:true}}}});new Chart(document.getElementById('mix'),{type:'bar',data:{labels:topics,datasets:statuses.map((s,i)=>({label:s,data:topics.map(t=>D.entries.filter(e=>e.topics.includes(t)&&e.group===s).length),backgroundColor:['#6b8afd','#f59e0b','#8b5cf6','#16a34a'][i]}))},options:{...base,scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true,ticks:{precision:0}}}}});</script></body></html>
